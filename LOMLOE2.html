<script>
const SOURCE_ROWS = [
 ["STEM1, STEM2, STEM3, STEM4, CD2, CPSAA5, CE3, CCEC4","1. Interpretar, modelizar y resolver problemas de la vida cotidiana y propios de las matemáticas, aplicando diferentes estrategias y formas de razonamiento, para explorar distintas maneras de proceder y obtener posibles soluciones.","1.1. Interpretar problemas matemáticos de la vida cotidiana, organizando los datos dados, estableciendo las relaciones entre ellos y comprendiendo las preguntas formuladas.","MAT.2.A.2.1|MAT.2.A.2.3"],
 ["STEM1, STEM2, STEM3, STEM4, CD2, CPSAA5, CE3, CCEC4","1. Interpretar, modelizar y resolver problemas de la vida cotidiana y propios de las matemáticas, aplicando diferentes estrategias y formas de razonamiento, para explorar distintas maneras de proceder y obtener posibles soluciones.","1.2. Aplicar, en problemas de la vida cotidiana, herramientas y estrategias apropiadas, como pueden ser la descomposición en problemas más sencillos, el tanteo, la estimación, el ensayo y error o la búsqueda de patrones, que contribuyan a la resolución de problemas en situaciones diversas.","MAT.2.A.3.1|MAT.2.B.1.2|MAT.2.B.2.1|MAT.2.D.4.2"],
 ["STEM1, STEM2, STEM3, STEM4, CD2, CPSAA5, CE3, CCEC4","1. Interpretar, modelizar y resolver problemas de la vida cotidiana y propios de las matemáticas, aplicando diferentes estrategias y formas de razonamiento, para explorar distintas maneras de proceder y obtener posibles soluciones.","1.3. Obtener las soluciones matemáticas en problemas de la vida cotidiana, activando los conocimientos necesarios, utilizando herramientas tecnológicas necesarias, interpretando los resultados y aceptando el error como parte del proceso.","MAT.2.A.2.2|MAT.2.A.3.4|MAT.2.F.1.3"],
 ["STEM1, STEM2, CD2, CPSAA4, CC3, CE3","2. Analizar las soluciones de un problema usando diferentes técnicas y herramientas, evaluando las respuestas obtenidas, para verificar su validez e idoneidad desde un punto de vista matemático y su repercusión global.","2.1. Comprobar, mediante el razonamiento matemático, la corrección de las soluciones de un problema, usando herramientas digitales como calculadoras, hojas de cálculo o programas específicos.","MAT.2.A.3.5|MAT.2.D.4.4|MAT.2.D.5.3"],
 ["STEM1, STEM2, CD2, CPSAA4, CC3, CE3","2. Analizar las soluciones de un problema usando diferentes técnicas y herramientas, evaluando las respuestas obtenidas, para verificar su validez e idoneidad desde un punto de vista matemático y su repercusión global.","2.2. Comprobar, mediante la lectura comprensiva, la validez de las soluciones obtenidas en un problema, comprobando su coherencia en el contexto planteado y evaluando el alcance y repercusión de estas soluciones desde diferentes perspectivas: igualdad de género, sostenibilidad, consumo responsable, equidad o no discriminación.","MAT.2.A.6|MAT.2.B.3|MAT.2.F.3.2"],
 ["CCL1, STEM1, STEM2, CD1, CD2, CD5, CE3","3. Formular y comprobar conjeturas sencillas o plantear problemas de forma autónoma, reconociendo el valor del razonamiento y la argumentación, para generar nuevo conocimiento.","3.1. Formular y comprobar conjeturas sencillas en situaciones del mundo real de forma guiada, trabajando de forma individual o colectiva la utilización del razonamiento inductivo y deductivo para formular argumentos matemáticos, analizando patrones, propiedades y relaciones, y examinando su validez.","MAT.2.A.3.3|MAT.2.B.1.1|MAT.2.D.4.3"],
 ["CCL1, STEM1, STEM2, CD1, CD2, CD5, CE3","3. Formular y comprobar conjeturas sencillas o plantear problemas de forma autónoma, reconociendo el valor del razonamiento y la argumentación, para generar nuevo conocimiento.","3.2. Plantear, en términos matemáticos, variantes de un problema dado, en contextos de la vida cotidiana, modificando alguno de sus datos o alguna condición del problema, consolidando así los conceptos matemáticos.","MAT.2.D.5.2|MAT.2.D.6.1"],
 ["CCL1, STEM1, STEM2, CD1, CD2, CD5, CE3","3. Formular y comprobar conjeturas sencillas o plantear problemas de forma autónoma, reconociendo el valor del razonamiento y la argumentación, para generar nuevo conocimiento.","3.3. Emplear herramientas tecnológicas adecuadas, calculadoras o software matemáticos como entornos de geometría dinámica; paquetes estadísticos o programas de análisis numérico, en la investigación y comprobación de conjeturas o problemas.","MAT.2.C.1.3"],
 ["STEM1, STEM2, STEM3, CD2, CD3, CD5, CE3","4. Utilizar los principios del pensamiento computacional organizando datos, descomponiendo en partes, reconociendo patrones, interpretando, modificando y creando algoritmos para modelizar situaciones y resolver problemas de forma eficaz.","4.1. Reconocer patrones en la resolución de problemas complejos, organizar datos y descomponer un problema en partes más simples facilitando su interpretación computacional y relacionando los aspectos fundamentales de la informática con las necesidades del alumnado.","MAT.2.A.1.1|MAT.2.D.6.2|MAT.2.D.6.3"],
 ["STEM1, STEM2, STEM3, CD2, CD3, CD5, CE3","4. Utilizar los principios del pensamiento computacional organizando datos, descomponiendo en partes, reconociendo patrones, interpretando, modificando y creando algoritmos para modelizar situaciones y resolver problemas de forma eficaz.","4.2. Modelizar situaciones de la vida cotidiana y resolver problemas de forma eficaz, interpretando y modificando algoritmos, creando modelos abstractos de situaciones cotidianas.","MAT.2.C.3.1|MAT.2.D.1|MAT.2.D.2.1"],
 ["STEM1, STEM3, CD2, CD3, CCEC1","5. Reconocer y utilizar conexiones entre los diferentes elementos matemáticos, interconectando conceptos y procedimientos para desarrollar una visión de las matemáticas como un todo integrado.","5.1. Reconocer y usar las relaciones entre los conocimientos y experiencias matemáticas de los bloques de saberes y de los distintos niveles formando un todo coherente, reconociendo y utilizando las conexiones entre ideas matemáticas en la resolución de problemas de la vida cotidiana.","MAT.2.A.3.2|MAT.2.C.1.1|MAT.2.C.1.2|MAT.2.C.2"],
 ["STEM1, STEM3, CD2, CD3, CCEC1","5. Reconocer y utilizar conexiones entre los diferentes elementos matemáticos, interconectando conceptos y procedimientos para desarrollar una visión de las matemáticas como un todo integrado.","5.2. Realizar conexiones entre diferentes procesos matemáticos y entender cómo unas ideas se construyen sobre otras, aplicando conocimientos y experiencias previas y enlazándolas con las nuevas ideas.","MAT.2.A.2.5|MAT.2.A.4.1"],
 ["STEM1, STEM2, CD3, CD5, CC4, CE2, CE3, CCEC1","6. Identificar las matemáticas implicadas en otras materias, en situaciones reales y en el entorno, susceptibles de ser abordadas en términos matemáticos, interrelacionando conceptos y procedimientos, para aplicarlos en situaciones diversas.","6.1. Reconocer situaciones en diferentes contextos (personal, escolar y social) susceptibles de ser formuladas y resueltas mediante herramientas y estrategias matemáticas, estableciendo conexiones entre el mundo real y las matemáticas usando los procesos inherentes a la investigación científica y matemática: inferir, medir, comunicar, clasificar y predecir, aplicando distintos procedimientos sencillos en la resolución de problemas en situaciones diversas.","MAT.2.A.1.2|MAT.2.A.5.1|MAT.2.A.5.2"],
 ["STEM1, STEM2, CD3, CD5, CC4, CE2, CE3, CCEC1","6. Identificar las matemáticas implicadas en otras materias, en situaciones reales y en el entorno, susceptibles de ser abordadas en términos matemáticos, interrelacionando conceptos y procedimientos, para aplicarlos en situaciones diversas.","6.2. Analizar conexiones coherentes entre ideas y conceptos matemáticos con otras materias y con la vida real y aplicarlas mediante el uso de procedimientos sencillos en la resolución de problemas en situaciones de la vida cotidiana.","MAT.2.C.3.2|MAT.2.D.2.2|MAT.2.D.4.1"],
 ["STEM1, STEM2, CD3, CD5, CC4, CE2, CE3, CCEC1","6. Identificar las matemáticas implicadas en otras materias, en situaciones reales y en el entorno, susceptibles de ser abordadas en términos matemáticos, interrelacionando conceptos y procedimientos, para aplicarlos en situaciones diversas.","6.3. Reconocer en diferentes contextos (personal, escolar y social), la aportación de las matemáticas al progreso de la humanidad y su contribución a la superación de los retos que demanda la sociedad actual, identificando algunas aportaciones hechas desde nuestra comunidad.","MAT.2.F.3.2|MAT.2.F.3.3"],
 ["STEM3, CD1, CD2, CD5, CE3, CCEC4","7. Representar, de forma individual y colectiva, conceptos, procedimientos, información y resultados matemáticos, usando diferentes tecnologías, para visualizar ideas y estructurar procesos matemáticos.","7.1. Representar conceptos, procedimientos, información y resultados matemáticos usando diferentes herramientas digitales y formas de representación adecuadas para visualizar ideas y estructurar procesos matemáticos, interpretando y resolviendo problemas de la vida real de relativa complejidad y valorando su utilidad para compartir información.","MAT.2.A.2.4|MAT.2.B.2.3"],
 ["STEM3, CD1, CD2, CD5, CE3, CCEC4","7. Representar, de forma individual y colectiva, conceptos, procedimientos, información y resultados matemáticos, usando diferentes tecnologías, para visualizar ideas y estructurar procesos matemáticos.","7.2. Elaborar en el contexto del problema, representaciones matemáticas, utilizando herramientas de interpretación y modelización como expresiones simbólicas o gráficas que ayuden a tomar decisiones en la búsqueda de estrategias de resolución de una situación problematizada.","MAT.2.A.5.3|MAT.2.B.2.2"],
 ["CCL1, CCL3, CP1, STEM2, STEM4, CD2, CD3, CE3, CCEC3","8. Comunicar de forma individual y colectiva conceptos, procedimientos y argumentos matemáticos, usando lenguaje oral, escrito o gráfico, utilizando la terminología matemática apropiada, para dar significado y coherencia a las ideas matemáticas.","8.1. Comunicar ideas, conceptos y procesos, utilizando el lenguaje matemático apropiado, empleando diferentes medios, incluidos los digitales, oralmente y por escrito, al describir, explicar y justificar razonamientos, procedimientos y conclusiones.","MAT.2.D.3"],
 ["CCL1, CCL3, CP1, STEM2, STEM4, CD2, CD3, CE3, CCEC3","8. Comunicar de forma individual y colectiva conceptos, procedimientos y argumentos matemáticos, usando lenguaje oral, escrito o gráfico, utilizando la terminología matemática apropiada, para dar significado y coherencia a las ideas matemáticas.","8.2. Reconocer y emplear el lenguaje matemático presente en los ámbitos personal, social y educativo, expresando y comunicando mensajes con contenido matemático y utilizando terminología matemática adecuada de forma clara, precisa, rigurosa y veraz.","MAT.2.A.4.2|MAT.2.D.5.1"],
 ["STEM5, CPSAA1, CPSAA4, CPSAA5, CE2, CE3","9. Desarrollar destrezas personales, identificando y gestionando emociones, poniendo en práctica estrategias de aceptación del error como parte del proceso de aprendizaje y adaptándose ante situaciones de incertidumbre, para mejorar la perseverancia en la consecución de objetivos y el disfrute en el aprendizaje de las matemáticas.","9.1. Gestionar las emociones propias y desarrollar el autoconcepto matemático como herramienta, generando expectativas positivas ante el tratamiento y la gestión de retos matemáticos y cambios, desarrollando, de manera progresiva, el pensamiento crítico y creativo, adaptándose ante la incertidumbre y reconociendo fuentes de estrés.","MAT.2.F.1.1"],
 ["STEM5, CPSAA1, CPSAA4, CPSAA5, CE2, CE3","9. Desarrollar destrezas personales, identificando y gestionando emociones, poniendo en práctica estrategias de aceptación del error como parte del proceso de aprendizaje y adaptándose ante situaciones de incertidumbre, para mejorar la perseverancia en la consecución de objetivos y el disfrute en el aprendizaje de las matemáticas.","9.2. Mostrar una actitud positiva y perseverante, aceptando la crítica razonada, tomando conciencia de los errores cometidos y reflexionando sobre su propio esfuerzo y dedicación personal al hacer frente a las diferentes situaciones de aprendizaje de las matemáticas.","MAT.2.F.1.2|MAT.2.F.1.3"],
 ["CCL5, CP3, STEM3, CPSAA1, CPSAA3, CC2, CC3","10. Desarrollar destrezas sociales, reconociendo y respetando las emociones y experiencias de los demás, participando activa y reflexivamente en proyectos en equipos heterogéneos con roles asignados, para construir una identidad positiva como estudiante de matemáticas, para fomentar el bienestar personal y grupal y para crear relaciones saludables.","10.1. Colaborar activamente y construir relaciones saludables en el trabajo de las matemáticas en equipos heterogéneos, respetando diferentes opiniones, desarrollando destrezas de comunicación efectiva, planificación, indagación, motivación y confianza en sus propias posibilidades y de pensamiento crítico y creativo, tomando decisiones y realizando juicios informados.","MAT.2.F.2.1|MAT.2.F.2.2"],
 ["CCL5, CP3, STEM3, CPSAA1, CPSAA3, CC2, CC3","10. Desarrollar destrezas sociales, reconociendo y respetando las emociones y experiencias de los demás, participando activa y reflexivamente en proyectos en equipos heterogéneos con roles asignados, para construir una identidad positiva como estudiante de matemáticas, para fomentar el bienestar personal y grupal y para crear relaciones saludables.","10.2. Participar en el reparto de tareas que deban desarrollarse en equipo, aportando valor, favoreciendo la inclusión, la escucha activa, participando de forma respetuosa, dialogante y constructiva, asumiendo el rol asignado, analizando los estereotipos e ideas preconcebidas sobre las matemáticas asociadas a cuestiones individuales y responsabilizándose de la propia contribución al equipo.","MAT.2.F.2.1|MAT.2.F.3.1"]

const DEFINITIONS={
"MAT.2.A.1.1":"Estrategias variadas de recuento sistemático en situaciones de la vida cotidiana.","MAT.2.A.1.2":"Adaptación del conteo al tamaño de los números en problemas de la vida cotidiana.","MAT.2.A.2.1":"Números grandes y pequeños: la notación exponencial y científica y el uso de la calculadora.","MAT.2.A.2.2":"Realización de estimaciones con la precisión requerida.","MAT.2.A.2.3":"Números enteros, fraccionarios, decimales y raíces en la expresión de cantidades en contextos de la vida cotidiana.","MAT.2.A.2.4":"Diferentes formas de representación de números enteros, fraccionarios y decimales, incluida la recta numérica.","MAT.2.A.2.5":"Interpretación del significado de las variaciones porcentuales.","MAT.2.A.3.1":"Estrategias de cálculo mental con números naturales, enteros, fracciones y decimales.","MAT.2.A.3.2":"Operaciones con números enteros, fraccionarios o decimales en situaciones contextualizadas.","MAT.2.A.3.3":"Relaciones inversas entre las operaciones (adición y sustracción; multiplicación y división; elevar al cuadrado y extraer la raíz cuadrada): comprensión y utilización en la simplificación y resolución de problemas.","MAT.2.A.3.4":"Efecto de las operaciones aritméticas con números enteros, fracciones y expresiones decimales.","MAT.2.A.3.5":"Propiedades de las operaciones (suma, resta, multiplicación, división y potenciación): cálculos de manera eficiente con números naturales, enteros, fraccionarios y decimales tanto mentalmente como de forma manual, con calculadora u hoja de cálculo.","MAT.2.A.4.1":"Factores, múltiplos y divisores. Factorización en números primos para resolver problemas: estrategias y herramientas.","MAT.2.A.4.2":"Selección de la representación adecuada para una misma cantidad en cada situación o problema.","MAT.2.A.5.1":"Razones y proporciones: comprensión y representación de relaciones cuantitativas.","MAT.2.A.5.2":"Porcentajes: comprensión y resolución de problemas.","MAT.2.A.5.3":"Situaciones de proporcionalidad en diferentes contextos: análisis y desarrollo de métodos para la resolución de problemas (aumentos y disminuciones porcentuales, rebajas y subidas de precios, impuestos, escalas, cambios de divisas, velocidad y tiempo, etc.).","MAT.2.A.6":"Métodos para la toma de decisiones de consumo responsable atendiendo a las relaciones entre calidad y precio, y a las relaciones entre valor y precio en contextos cotidianos.",
"MAT.2.B.1.1":"Atributos mensurables de los objetos físicos y matemáticos: reconocimiento, investigación y relación entre los mismos.","MAT.2.B.1.2":"Estrategias de elección de las unidades y operaciones adecuadas en problemas que impliquen medida.","MAT.2.B.2.1":"Longitudes, áreas y volúmenes en figuras planas y tridimensionales: deducción, interpretación y aplicación.","MAT.2.B.2.2":"Representaciones planas de objetos tridimensionales en la visualización y resolución de problemas de áreas.","MAT.2.B.2.3":"Representaciones de objetos geométricos con propiedades fijadas, como las longitudes de los lados o las medidas de los ángulos.","MAT.2.B.3":"Estrategias para la toma de decisión justificada del grado de precisión requerida en situaciones de medida.",
"MAT.2.C.1.1":"Figuras geométricas planas y tridimensionales: descripción y clasificación en función de sus propiedades o características.","MAT.2.C.1.2":"Relaciones geométricas como la congruencia, la semejanza, la relación pitagórica y la proporción cordobesa en figuras planas y tridimensionales: identificación y aplicación.","MAT.2.C.1.3":"Construcción de figuras geométricas con herramientas manipulativas y digitales (programas de geometría dinámica, realidad aumentada…).","MAT.2.C.2":"Relaciones espaciales: localización y descripción mediante coordenadas geométricas y otros sistemas de representación para examinar las propiedades de las figuras geométricas.","MAT.2.C.3.1":"Modelización geométrica: relaciones numéricas y algebraicas en la resolución de problemas.","MAT.2.C.3.2":"Relaciones geométricas en contextos matemáticos y no matemáticos (arte, ciencia, vida diaria…).",
"MAT.2.D.1":"Patrones, pautas y regularidades: observación y determinación de la regla de formación en casos sencillos.","MAT.2.D.2.1":"Modelización de situaciones de la vida cotidiana usando representaciones matemáticas y el lenguaje algebraico.","MAT.2.D.2.2":"Estrategias de deducción de conclusiones razonables a partir de un modelo matemático.","MAT.2.D.3":"Variable: comprensión del concepto en sus diferentes naturalezas.","MAT.2.D.4.1":"Relaciones lineales y cuadráticas en situaciones de la vida cotidiana o matemáticamente relevantes: expresión mediante álgebra simbólica.","MAT.2.D.4.2":"Equivalencia de expresiones algebraicas en la resolución de problemas basados en relaciones lineales y cuadráticas.","MAT.2.D.4.3":"Estrategias de búsqueda de las soluciones en ecuaciones y sistemas lineales y ecuaciones cuadráticas en situaciones de la vida cotidiana.","MAT.2.D.4.4":"Ecuaciones: resolución mediante el uso de la tecnología.","MAT.2.D.5.1":"Relaciones cuantitativas en situaciones de la vida cotidiana y clases de funciones que las modelizan.","MAT.2.D.5.2":"Relaciones lineales y cuadráticas: identificación y comparación de diferentes modos de representación, tablas, gráficas o expresiones algebraicas, y sus propiedades a partir de ellas.","MAT.2.D.5.3":"Estrategias de deducción de la información relevante de una función mediante el uso de diferentes representaciones simbólicas.","MAT.2.D.6.1":"Generalización y transferencia de procesos de resolución de problemas a otras situaciones.","MAT.2.D.6.2":"Estrategias para la interpretación, modificación de algoritmos.","MAT.2.D.6.3":"Estrategias de formulación de cuestiones susceptibles de ser analizados programas y otras herramientas.",

const BLOCKS={A:"Sentido numérico",B:"Sentido de la medida",C:"Sentido espacial",D:"Sentido algebraico",F:"Sentido socioafectivo"};
const rows=SOURCE_ROWS.map(([descriptors,competency,criterion,codes])=>({descriptors,competency,criterion,codes:codes.split("|")}));
const allCodes=[...new Set(rows.flatMap(r=>r.codes))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
let topics=[];let selected=new Set();let editingOriginal=null;
const $=id=>document.getElementById(id); const esc=s=>String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function codeBlock(c){return BLOCKS[c.split('.')[2]]||""} function shortId(text){return text.match(/^\d+(?:\.\d+)?/)?.[0]||""}
function toast(msg,error=false){const el=$("toast");el.textContent=msg;el.className="toast show"+(error?" error":"");clearTimeout(toast.t);toast.t=setTimeout(()=>el.className="toast",2600)}
function switchView(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===id));if(id==='topicsView')renderTopics();}
function renderKnowledge(){const q=$("search").value.trim().toLowerCase();const shown=allCodes.filter(c=>(c+' '+DEFINITIONS[c]).toLowerCase().includes(q));$("knowledgeGrid").innerHTML=shown.map(c=>`<label class="knowledge ${selected.has(c)?'selected':''}"><input type="checkbox" data-code="${c}" ${selected.has(c)?'checked':''}><span><span class="code">${c}</span><div class="definition">${esc(DEFINITIONS[c])}</div><span class="block-tag">${codeBlock(c)}</span></span></label>`).join('')||`<div class="empty">No se han encontrado saberes con esa búsqueda.</div>`;updateCount();}
function linksFor(code){return rows.filter(r=>r.codes.includes(code))}
function relationTable(codes){if(!codes.length)return `<div class="empty">Selecciona uno o varios saberes para generar la tabla de relaciones.</div>`;return `<div class="table-wrap"><table class="relations"><thead><tr><th style="width:19%">Saber básico</th><th style="width:26%">Criterio de evaluación</th><th style="width:35%">Competencia específica</th><th style="width:20%">Perfil de salida</th></tr></thead><tbody>${codes.map(code=>{const links=linksFor(code);return `<tr><td><div class="cell-code">${code}</div><div>${esc(DEFINITIONS[code])}</div></td><td>${links.map(x=>`<div class="subitem"><b>${shortId(x.criterion)}</b> ${esc(x.criterion.replace(/^\d+(?:\.\d+)?\.\s*/,''))}</div>`).join('')}</td><td>${[...new Map(links.map(x=>[shortId(x.competency),x.competency])).values()].map(x=>`<div class="subitem"><b>${shortId(x)}</b> ${esc(x.replace(/^\d+\.\s*/,''))}</div>`).join('')}</td><td>${[...new Set(links.flatMap(x=>x.descriptors.split(',').map(d=>d.trim())))].map(d=>`<span class="chip">${d}</span>`).join('')}</td></tr>`}).join('')}</tbody></table></div>`}
function updateCount(){$("selectedCount").textContent=`${selected.size} ${selected.size===1?'seleccionado':'seleccionados'}`;$("liveTable").innerHTML=relationTable([...selected].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})));}
function persist(){localStorage.setItem('curriculo2eso-project',JSON.stringify({version:1,topics}));}
function saveTopic(){const number=Number($("topicNumber").value),name=$("topicName").value.trim();if(!name)return toast('Escribe el nombre del tema.',true);if(!selected.size)return toast('Selecciona al menos un saber básico.',true);const item={number,name,codes:[...selected].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))};if(editingOriginal!==null){topics=topics.filter(t=>t.number!==editingOriginal);editingOriginal=null}const existing=topics.findIndex(t=>t.number===number);if(existing>=0)topics[existing]=item;else topics.push(item);topics.sort((a,b)=>a.number-b.number);persist();clearEditor();switchView('topicsView');toast('Tema guardado correctamente.');}
function clearEditor(){selected.clear();$("topicName").value='';$("search").value='';const used=new Set(topics.map(t=>t.number));$("topicNumber").value=String([...Array(20)].map((_,i)=>i+1).find(n=>!used.has(n))||1);renderKnowledge();}
function renderTopics(){$("tabCount").textContent=`(${topics.length})`;$("topicSummary").textContent=topics.length?`${topics.length} ${topics.length===1?'tema guardado':'temas guardados'} · ${new Set(topics.flatMap(t=>t.codes)).size} saberes distintos`:'No hay temas guardados.';$("topicList").innerHTML=topics.length?topics.map(t=>`<article class="topic-card"><div class="topic-head"><div class="topic-title"><span class="topic-number">${t.number}</span><div><h3>${esc(t.name)}</h3><small>${t.codes.length} ${t.codes.length===1?'saber asociado':'saberes asociados'}</small></div></div><div class="btns topic-actions"><button class="btn secondary edit-topic" data-number="${t.number}">Editar</button><button class="btn danger delete-topic" data-number="${t.number}">Eliminar</button></div></div><div class="topic-body">${relationTable(t.codes)}</div></article>`).join(''):`<div class="empty">Guarda el primer tema desde la pestaña «Configurar tema».</div>`;}
function editTopic(number){const t=topics.find(x=>x.number===number);if(!t)return;editingOriginal=number;$("topicNumber").value=t.number;$("topicName").value=t.name;selected=new Set(t.codes);$("search").value='';renderKnowledge();switchView('editorView');window.scrollTo({top:0,behavior:'smooth'});}
function removeTopic(number){const t=topics.find(x=>x.number===number);if(!t||!confirm(`¿Eliminar el tema ${t.number}. ${t.name}?`))return;topics=topics.filter(x=>x.number!==number);persist();renderTopics();toast('Tema eliminado.');}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function projectPayload(){return {app:'Relaciones curriculares Matemáticas 2.º ESO',version:1,savedAt:new Date().toISOString(),topics}}
function saveSvg(){if(!topics.length)return toast('No hay temas que guardar.',true);const json=JSON.stringify(projectPayload()).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const cards=topics.slice(0,8).map((t,i)=>`<text x="70" y="${190+i*45}" font-family="Segoe UI,Arial" font-size="22" fill="#17324d">Tema ${t.number}. ${esc(t.name).slice(0,64)} (${t.codes.length} saberes)</text>`).join('');const h=Math.max(600,250+Math.min(topics.length,8)*45);const svg=`<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="${h}" viewBox="0 0 1200 ${h}"><metadata id="project-data">${json}</metadata><rect width="1200" height="${h}" fill="#f4f7fa"/><rect width="1200" height="120" fill="#17324d"/><rect x="48" y="34" width="52" height="52" rx="12" fill="#d7a928"/><text x="64" y="72" font-family="Arial" font-size="28" font-weight="bold" fill="#17324d">Σ</text><text x="125" y="69" font-family="Segoe UI,Arial" font-size="30" font-weight="bold" fill="white">Proyecto curricular · Matemáticas 2.º ESO</text>${cards}<text x="70" y="${h-45}" font-family="Segoe UI,Arial" font-size="16" fill="#617080">Archivo de proyecto generado por la aplicación. Cárgalo para continuar editando.</text></svg>`;download(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),'proyecto_curricular_2ESO.svg');toast('Proyecto guardado en formato SVG.');}
async function loadSvg(file){try{const text=await file.text();const doc=new DOMParser().parseFromString(text,'image/svg+xml');const meta=doc.getElementById('project-data');if(!meta)throw Error();const data=JSON.parse(meta.textContent);if(!Array.isArray(data.topics))throw Error();const validCodes=new Set(allCodes);topics=data.topics.map(t=>({number:Math.max(1,Math.min(20,Number(t.number))),name:String(t.name||'').trim(),codes:[...new Set((t.codes||[]).filter(c=>validCodes.has(c)))]})).filter(t=>t.name&&t.codes.length).sort((a,b)=>a.number-b.number);persist();clearEditor();renderTopics();switchView('topicsView');toast(`Proyecto cargado: ${topics.length} temas.`)}catch(e){toast('El archivo no es un proyecto válido de esta aplicación.',true)}}
function exportPdf(){if(!topics.length)return toast('No hay temas que exportar.',true);const w=window.open('','_blank');if(!w)return toast('Permite las ventanas emergentes para crear el PDF.',true);const body=topics.map(t=>`<section><h2>Tema ${t.number}. ${esc(t.name)}</h2>${relationTable(t.codes)}</section>`).join('');w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Relaciones curriculares 2.º ESO</title><style>body{font:10pt Segoe UI,Arial;color:#17212b;margin:18mm}h1{color:#17324d;border-bottom:3px solid #d7a928;padding-bottom:8px}h2{color:#17324d;margin-top:24px;break-after:avoid}.table-wrap{overflow:visible}table{width:100%;border-collapse:collapse;table-layout:fixed}th{background:#17324d;color:white}th,td{border:1px solid #b8c7d3;padding:6px;vertical-align:top;font-size:8pt}.cell-code,b{color:#17324d}.chip{display:inline-block;border:1px solid #9fb6c7;border-radius:8px;padding:1px 4px;margin:1px}.subitem{margin-bottom:5px}section{break-before:page}section:first-of-type{break-before:auto}@page{size:A4 landscape;margin:10mm}</style></head><body><h1>Relaciones curriculares · Matemáticas 2.º ESO</h1>${body}<script>onload=()=>setTimeout(()=>print(),250)<\/script></body></html>`);w.document.close();}
function xmlEsc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function exportExcel(){if(!topics.length)return toast('No hay temas que exportar.',true);const head=['N.º tema','Tema','Saber básico','Definición del saber','Criterio de evaluación','Competencia específica','Descriptores operativos'];const data=[];topics.forEach(t=>t.codes.forEach(code=>linksFor(code).forEach(l=>data.push([t.number,t.name,code,DEFINITIONS[code],l.criterion,l.competency,l.descriptors]))));const row=a=>`<Row>${a.map((v,i)=>`<Cell><Data ss:Type="${i===0&&typeof v==='number'?'Number':'String'}">${xmlEsc(v)}</Data></Cell>`).join('')}</Row>`;const xml=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="Header"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#17324D" ss:Pattern="Solid"/><Alignment ss:Vertical="Center" ss:WrapText="1"/></Style><Style ss:ID="Cell"><Alignment ss:Vertical="Top" ss:WrapText="1"/></Style></Styles><Worksheet ss:Name="Relaciones"><Table><Column ss:Width="60"/><Column ss:Width="180"/><Column ss:Width="105"/><Column ss:Width="300"/><Column ss:Width="330"/><Column ss:Width="370"/><Column ss:Width="210"/>${`<Row ss:StyleID="Header">${head.map(v=>`<Cell><Data ss:Type="String">${xmlEsc(v)}</Data></Cell>`).join('')}</Row>`}${data.map(a=>row(a).replace('<Row>','<Row ss:StyleID="Cell">')).join('')}</Table><WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><FreezePanes/><FrozenNoSplit/><SplitHorizontal>1</SplitHorizontal><TopRowBottomPane>1</TopRowBottomPane><AutoFilter x:Range="R1C1:R${data.length+1}C7" xmlns="urn:schemas-microsoft-com:office:excel"/></WorksheetOptions></Worksheet></Workbook>`;download(new Blob([xml],{type:'application/vnd.ms-excel;charset=utf-8'}),'relaciones_curriculares_2ESO.xls');toast('Tabla Excel exportada.');}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>switchView(t.dataset.view)));$("knowledgeGrid").addEventListener('change',e=>{const c=e.target.dataset.code;if(!c)return;e.target.checked?selected.add(c):selected.delete(c);renderKnowledge()});$("search").addEventListener('input',renderKnowledge);$("selectNone").addEventListener('click',()=>{selected.clear();renderKnowledge()});$("saveTopic").addEventListener('click',saveTopic);$("topicList").addEventListener('click',e=>{const edit=e.target.closest('.edit-topic'),del=e.target.closest('.delete-topic');if(edit)editTopic(Number(edit.dataset.number));if(del)removeTopic(Number(del.dataset.number))});$("saveProject").addEventListener('click',saveSvg);$("loadProject").addEventListener('click',()=>$("projectFile").click());$("projectFile").addEventListener('change',e=>{if(e.target.files[0])loadSvg(e.target.files[0]);e.target.value=''});$("exportPdf").addEventListener('click',exportPdf);$("exportExcel").addEventListener('click',exportExcel);
$("topicNumber").innerHTML=[...Array(20)].map((_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');try{const saved=JSON.parse(localStorage.getItem('curriculo2eso-project'));if(saved&&Array.isArray(saved.topics))topics=saved.topics}catch{}renderKnowledge();renderTopics();
</script>
